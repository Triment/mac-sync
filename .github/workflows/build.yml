name: Build Desktop Apps

# 每次推送 main / 推送 v* 标签 / 手动触发都会构建，
# 并发布到以构建编号标记的 Release（如 build-42）
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # 用 github.run_number 作为 Release 标记
  RELEASE_TAG: build-${{ github.run_number }}

jobs:
  # 先创建 Release（避免多个构建 job 并发创建时竞态冲突）
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          # 已存在（如重跑同一编号）则复用
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists, reusing"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SyncMac $RELEASE_TAG" \
              --notes "自动构建 #${{ github.run_number }}（${{ github.sha }}），在 Assets 中下载对应平台安装包。"
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon（当前 Mac 常见架构）
          # - os: macos-latest
          #   target: aarch64-apple-darwin
          #   label: macos-aarch64
          # macOS Intel
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
          # Windows x64（msi + nsis 安装包）
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # 只负责构建，不做发布（发布统一由 softprops 处理）
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        with:
          args: --target ${{ matrix.target }}

      # 上传安装包到 Release 页面
      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          name: SyncMac (build ${{ github.run_number }})
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          body: |
            mac地址管理工具
      # 同时留一份 Actions artifact，构建失败时便于排查
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SyncMac-${{ matrix.label }}
          if-no-files-found: warn
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
