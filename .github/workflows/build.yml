name: Build Desktop Apps

# 推送 v* 标签时构建并自动发布 Release；也可手动触发（仅构建，产出 artifact）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 标签推送时先创建 Release（拿到 releaseId，避免三个构建 job 并发创建时竞态冲突）
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Create release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 已存在（如重跑）则复用
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists, reusing"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "SyncMac ${GITHUB_REF_NAME}" \
              --notes "在下方 Assets 中下载对应平台的安装包。"
          fi
          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq .id)
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    # workflow_dispatch 时 create-release 被跳过，仍需执行构建
    if: always() && !failure()
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon（当前 Mac 常见架构）
          # - os: macos-latest
          #   target: aarch64-apple-darwin
          #   label: macos-aarch64
          # macOS Intel
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
          # Windows x64（msi + nsis 安装包）
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # 标签推送时上传到已创建的 Release；手动触发时只构建
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}

      # 非标签构建时也能从 Actions 页面下载产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SyncMac-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
